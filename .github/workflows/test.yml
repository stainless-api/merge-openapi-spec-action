name: Test Action

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-basic-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test basic merge with multiple files
        id: merge
        uses: ./
        with:
          input_files: "test-fixtures/users-api.json,test-fixtures/products-api.yaml"
          output_path: ./test-output/merged-basic.yaml

      - name: Verify merge results
        run: |
          echo "Merged file: ${{ steps.merge.outputs.merged_file }}"
          echo "Total paths: ${{ steps.merge.outputs.path_count }}"

          if [ ! -f "${{ steps.merge.outputs.merged_file }}" ]; then
            echo "Error: Merged file not found!"
            exit 1
          fi

          if [ "${{ steps.merge.outputs.path_count }}" != "4" ]; then
            echo "Error: Expected 4 paths, got ${{ steps.merge.outputs.path_count }}"
            exit 1
          fi

          npx @redocly/cli lint "${{ steps.merge.outputs.merged_file }}" --skip-rule=path-not-include-query --skip-rule=security-defined
          echo "✅ Basic merge test passed!"

  test-glob-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test with glob patterns
        id: glob
        uses: ./
        with:
          input_files: "test-fixtures/*.yaml"
          output_path: ./merged-glob.yaml
          server_url_strategy: |
            global: https://api.example.com
            preserve:
              - https://api.conflict1.com
              - https://api.conflict2.com
              - https://api.special.stainless.com
              - https://api.another.stainless.com

      - name: Verify glob results
        run: |
          PATHS="${{ steps.glob.outputs.path_count }}"
          if [ "$PATHS" -lt "5" ]; then
            echo "Error: Expected at least 5 paths from glob pattern, got $PATHS"
            exit 1
          fi
          echo "✅ Glob pattern test passed with $PATHS paths"

  test-server-url-strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test with server URL strategy
        id: strategy
        uses: ./
        with:
          input_files: "test-fixtures/main-api.yaml,test-fixtures/special-api.yaml,test-fixtures/local-api.yaml"
          output_path: ./merged-strategy.yaml
          server_url_strategy: |
            global: https://api.stainless.com
            preserve:
              - https://api.special.stainless.com

      - name: Verify server strategy
        run: |
          # Check global server is set
          if ! grep -q "servers:" "${{ steps.strategy.outputs.merged_file }}"; then
            echo "Error: No global servers found"
            exit 1
          fi

          if ! grep -q "url: https://api.stainless.com" "${{ steps.strategy.outputs.merged_file }}"; then
            echo "Error: Global server URL not found"
            exit 1
          fi

          # Check path disambiguation for preserved servers
          if ! grep -q "/special/feature?base=api.special.stainless.com" "${{ steps.strategy.outputs.merged_file }}"; then
            echo "Error: Path disambiguation not working"
            exit 1
          fi

          # Check that local API paths don't have ?base= (should use global)
          if grep -q "/local/test?base=" "${{ steps.strategy.outputs.merged_file }}"; then
            echo "Error: Local paths should not have base parameter"
            exit 1
          fi

          echo "✅ Server URL strategy test passed!"

  test-path-collision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test path collision handling
        id: collision
        uses: ./
        with:
          input_files: "test-fixtures/main-api.yaml,test-fixtures/another-api.yaml"
          output_path: ./merged-collision.yaml
          server_url_strategy: |
            global: https://api.stainless.com
            preserve:
              - https://api.another.stainless.com

      - name: Verify collision handling
        run: |
          # Both have /search - verify they don't collide
          SEARCH_COUNT=$(grep -c "^  /search" "${{ steps.collision.outputs.merged_file }}" || true)

          if [ "$SEARCH_COUNT" -lt "2" ]; then
            echo "Error: Expected 2 search paths (disambiguated), found $SEARCH_COUNT"
            exit 1
          fi

          # Check both paths exist
          if ! grep -q "^  /search:$" "${{ steps.collision.outputs.merged_file }}"; then
            echo "Error: Main /search path not found"
            exit 1
          fi

          if ! grep -q "^  /search?base=api.another.stainless.com:$" "${{ steps.collision.outputs.merged_file }}"; then
            echo "Error: Disambiguated /search path not found"
            exit 1
          fi

          echo "✅ Path collision handling test passed!"

  test-single-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test with single file
        id: single
        uses: ./
        with:
          input_files: "test-fixtures/users-api.json"
          output_path: ./single-output.yaml

      - name: Verify single file handling
        run: |
          if [ "${{ steps.single.outputs.path_count }}" != "2" ]; then
            echo "Error: Expected 2 paths from single file"
            exit 1
          fi
          echo "✅ Single file test passed!"

  test-error-handling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test with non-existent files
        id: error
        uses: ./
        with:
          input_files: "non-existent/**/*.yaml"
          output_path: ./should-not-exist.yaml
        continue-on-error: true

      - name: Verify error handling
        run: |
          if [ "${{ steps.error.outcome }}" != "failure" ]; then
            echo "Error: Action should have failed with non-existent files"
            exit 1
          fi

          if [ -f "./should-not-exist.yaml" ]; then
            echo "Error: Output file should not exist after failure"
            exit 1
          fi

          echo "✅ Error handling test passed!"

  test-complex-scenario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create additional test spec
        run: |
          cat > test-fixtures/temp-api.yaml <<EOF
          openapi: 3.0.0
          info:
            title: Temp API
            version: 1.0.0
          servers:
            - url: https://temp.api.com
          paths:
            /temp:
              get:
                summary: Temp endpoint
                responses:
                  '200':
                    description: Success
          EOF

      - name: Test complex merge scenario
        id: complex
        uses: ./
        with:
          input_files: "test-fixtures/main-api.yaml,test-fixtures/special-api.yaml,test-fixtures/another-api.yaml,test-fixtures/local-api.yaml,test-fixtures/users-api.json,test-fixtures/products-api.yaml,test-fixtures/temp-api.yaml"
          output_path: ./complex-merged.yaml
          server_url_strategy: |
            global: https://api.stainless.com
            preserve:
              - https://api.special.stainless.com
              - https://api.another.stainless.com

      - name: Verify complex merge
        run: |
          PATHS="${{ steps.complex.outputs.path_count }}"
          echo "Merged $PATHS paths from multiple specs"

          # Verify the file is valid OpenAPI
          npx @redocly/cli lint "${{ steps.complex.outputs.merged_file }}" --skip-rule=path-not-include-query --skip-rule=security-defined

          # Check preserved servers
          if ! grep -q "/special/feature?base=api.special.stainless.com" "${{ steps.complex.outputs.merged_file }}"; then
            echo "Error: Special API paths not preserved correctly"
            exit 1
          fi

          if ! grep -q "/search?base=api.another.stainless.com" "${{ steps.complex.outputs.merged_file }}"; then
            echo "Error: Another API paths not preserved correctly"
            exit 1
          fi

          echo "✅ Complex scenario test passed!"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complex-test-output
          path: ./complex-merged.yaml